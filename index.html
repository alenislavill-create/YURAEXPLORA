    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)

            background-position: center;

            margin-bottom: 15px;
        }

        .contenido-inicio p {

        .botones {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .botones a {
            text-decoration: none;
            background: #7a5c3e;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;

        .botones a:hover {
